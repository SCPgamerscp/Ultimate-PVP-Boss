name: Build and regression tests
on:
  push:
    branches: [main, genspark_ai_developer]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        forge: ['47.3.0', '47.4.10']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build reobfuscated mod and run regression tests
        run: bash gradlew --no-daemon --max-workers=2 -Pforge_version=${{ matrix.forge }} build
      - name: Verify projectile spawning, NBT, Loyalty and collision in Forge
        run: bash gradlew --no-daemon --max-workers=2 -Pforge_version=${{ matrix.forge }} runGameTestServer
      - uses: actions/upload-artifact@v4
        with:
          name: ultimatepvpboss-1.0.2-forge-${{ matrix.forge }}
          path: build/libs/*.jar
          if-no-files-found: error
